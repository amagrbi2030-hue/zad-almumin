name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project zip (if uploaded as a zip)
        run: |
          if [ -f zad-almumin-android.zip ]; then unzip -o -q zad-almumin-android.zip -d . ; fi
          ls -la

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk zad-almumin.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: zad-almumin-apk
          path: zad-almumin.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: زاد المؤمن ${{ github.run_number }}
          files: zad-almumin.apk
